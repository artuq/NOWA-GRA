formulas:
  - name: resolve_path_eligibility
    expression: "Path Resolution Algorithm — filters registered_paths by threshold_min, returns highest counter if margin met, else null"
    variables: [counters, registered_paths, margin]
    output_range: "{path_name, null}"
    source: design/gdd/history-flag-system.md
    referenced_by: []

  - name: haters_growth_rate
    expression: "H_rate(C) = H_base + (C / 100)^H_exp × H_max_add"
    variables: [C, H_base, H_exp, H_max_add, "Δt"]
    output_range: "[H_base, H_base + H_max_add] Hatersi/min"
    source: design/gdd/resource-system.md
    referenced_by: [design/gdd/offline-progress-system.md]

  - name: morale_drain_rate
    expression: "M_drain(N) = M_drain_per_hater × max(0, N - N_buffer)^M_drain_exp"
    variables: [N, N_buffer, M_drain_per_hater, M_drain_exp, "Δt"]
    output_range: "0 at N<=N_buffer; unbounded beyond"
    source: design/gdd/resource-system.md
    referenced_by: [design/gdd/offline-progress-system.md]

  - name: action_effectiveness_multiplier
    expression: "Mult(M) — piecewise lookup on Morale bands"
    variables: [M]
    output_range: "{0.50, 0.75, 0.90, 1.00}"
    source: design/gdd/resource-system.md
    referenced_by: [design/gdd/offline-progress-system.md]

  - name: passive_zasiegi_income
    expression: "Z_passive(N, Δt) = N × Z_per_hater × Mult(M) × (Δt / 60)"
    variables: [N, Z_per_hater, "Mult(M)", "Δt"]
    output_range: ">= 0, unbounded upward"
    source: design/gdd/resource-system.md
    referenced_by: [design/gdd/offline-progress-system.md]

  - name: cringe_delta_from_actions
    expression: "ΔCringe = clamp(C + Cringe_delta_action, 0, 100) - C"
    variables: [C, Cringe_delta_action]
    output_range: "[0, 100] clamped"
    source: design/gdd/resource-system.md
    referenced_by: [design/gdd/action-system.md]

  - name: final_zasiegi_reward
    expression: "final_zasiegi_reward = base_zasiegi × Mult(M)"
    variables: [base_zasiegi, "Mult(M)"]
    output_range: "4-value discrete output per action (0.5x/0.75x/0.9x/1.0x of base)"
    source: design/gdd/action-system.md
    referenced_by: []

  - name: card_selection_weight
    expression: "weight(card) = base_weight + (current_Cringe / 100) × intensity(card)"
    variables: [base_weight, current_Cringe, "intensity(card)"]
    output_range: "[10, 45] given current locked content"
    source: design/gdd/decision-card-system.md
    referenced_by: []

  - name: simulate_offline
    expression: "Stepped 1-minute simulation of Hatersi growth, Morale drain, and passive Zasięgi income over a capped offline Δt"
    variables: ["Δt_seconds", Cringe_fixed, H0, M0]
    output_range: "{final_H, final_M, total_Z_gained, capped}"
    source: design/gdd/offline-progress-system.md
    referenced_by: []

  - name: magnitude
    expression: "magnitude(deltas) = clamp(max over r in deltas of contribution(r), 0.0, 1.0); contribution(r) = |delta_r|/norm_ref(r) for bounded resources, log(1+|delta_r|)/log(1+Z_norm_ref) for unbounded"
    variables: [deltas, r, "norm_ref(r)", Z_norm_ref]
    output_range: "[0.0, 1.0]"
    source: design/gdd/juice-feedback-system.md
    referenced_by: []

  - name: payoff_duration
    expression: "payoff_duration(text_length) = clamp(D_min + (text_length/L_ref) × (D_max-D_min), D_min, D_max)"
    variables: [text_length, D_min, D_max, L_ref]
    output_range: "[1.5, 2.5] seconds"
    source: design/gdd/juice-feedback-system.md
    referenced_by: []

  - name: card_contribution
    expression: "card_contribution[path] = min(choice_count[path] * CARD_AFFILIATION_PER_CHOICE, CARD_CONTRIBUTION_MAX)"
    variables: [choice_count, CARD_AFFILIATION_PER_CHOICE, CARD_CONTRIBUTION_MAX]
    output_range: "[0.0, CARD_CONTRIBUTION_MAX] (default [0.0, 60.0])"
    source: design/gdd/class-path-system.md
    referenced_by: []

  - name: investment_contribution
    expression: "investment_contribution[path] = resource_spent[path] * INVESTMENT_AFFILIATION_RATE[path]"
    variables: [resource_spent, INVESTMENT_AFFILIATION_RATE]
    output_range: "[0.0, unbounded) pre-clamp — re-clamped by affiliation formula"
    source: design/gdd/class-path-system.md
    referenced_by: []

  - name: affiliation
    expression: "affiliation[path] = min(card_contribution[path] + investment_contribution[path], 100.0)"
    variables: [card_contribution, investment_contribution]
    output_range: "[0.0, 100.0]"
    source: design/gdd/class-path-system.md
    referenced_by: []

  - name: class_path_tier
    expression: "tier[path] = max({t in {0..5} | affiliation[path] >= TIER_THRESHOLDS[t]})"
    variables: [affiliation, TIER_THRESHOLDS]
    output_range: "[0, 5] integer"
    source: design/gdd/class-path-system.md
    referenced_by: []

  - name: class_path_active_resolution
    expression: "active_path = argmax affiliation among Tier1+ paths if lead over 2nd-place >= PATH_AFFILIATION_TIE_BREAK_MARGIN, else ambiguous (null)"
    variables: [tier, affiliation, PATH_AFFILIATION_TIE_BREAK_MARGIN]
    output_range: "{path_id, null}"
    source: design/gdd/class-path-system.md
    referenced_by: []

  - name: meta_bonus_grant_magnitude
    expression: "raw_increment[type] = BASE_INCREMENT[type] * tier_factor(tier_at_burnout) * (combined_meta_multiplier)^META_CHALLENGE_SCALING_EXPONENT * first_burnout_factor; bonus_increment = min(raw_increment, FIRST_BURNOUT_GRANT_CAP_FRACTION * META_BONUS_MAX[type]) if first grant else raw_increment"
    variables: [type, tier_factor, tier_at_burnout, combined_meta_multiplier, BASE_INCREMENT, META_CHALLENGE_SCALING_EXPONENT, first_burnout_factor, FIRST_BURNOUT_GRANT_CAP_FRACTION]
    output_range: "> 0.0, unbounded pre-cap on raw_increment; first-ever grant per type additionally ceilinged at FIRST_BURNOUT_GRANT_CAP_FRACTION * META_BONUS_MAX[type]"
    note: "Revised 2026-07-13 per /design-review (2 rounds) — original pure tier_at_burnout scaling penalized path-switching (~5:1 vs mastery) and could overshoot a type's lifetime cap by up to 2.42x on a first-ever grant. tier_factor(tier)=(TIER_FLAT_BASE+tier)*5/(TIER_FLAT_BASE+5), tier_factor(5)=5.0 always (unchanged from original)."
    source: design/gdd/prestige-checkpoint-system.md
    referenced_by: []

  - name: meta_bonus_variety_completionist
    expression: "variety_grant[type] = BASE_INCREMENT[type] * VARIETY_BONUS_MULT for all 4 types simultaneously, once per save, when the 4th type first goes nonzero"
    variables: [BASE_INCREMENT, VARIETY_BONUS_MULT]
    output_range: "> 0.0 per type, applied via meta_bonus_running_total's normal cap logic"
    note: "New 2026-07-13 /design-review re-review — one-time additive lever rewarding trying all 4 Class Paths, independent of tier_factor's mastery-favoring math"
    source: design/gdd/prestige-checkpoint-system.md
    referenced_by: []

  - name: meta_bonus_running_total
    expression: "META_BONUS_total[type] = min(META_BONUS_total_prev[type] + bonus_increment[type], META_BONUS_MAX[type])"
    variables: [META_BONUS_total_prev, bonus_increment, META_BONUS_MAX]
    output_range: "[0.0, META_BONUS_MAX[type]], monotonically non-decreasing across game lifetime"
    source: design/gdd/prestige-checkpoint-system.md
    referenced_by: []

  - name: meta_reach_final_reward
    expression: "final_reach(action_id) = base_reach(action_id) * Mult(M) * class_path_multiplier(action_id) * challenge_modifier(action_id) * (1 + META_REACH_MULT_total)"
    variables: [base_reach, "Mult(M)", class_path_multiplier, challenge_modifier, META_REACH_MULT_total]
    output_range: "[0, unbounded in principle, practically bounded by each factor's cap]"
    source: design/gdd/prestige-checkpoint-system.md
    referenced_by: []

  - name: meta_haters_resist
    expression: "H_rate_final(C) = H_rate(C) * (1 - META_HATERS_RESIST_total)"
    variables: ["H_rate(C)", META_HATERS_RESIST_total]
    output_range: "[0.60 * H_rate(C), H_rate(C)] — applies online AND offline (locked scope decision)"
    source: design/gdd/prestige-checkpoint-system.md
    referenced_by: []

  - name: staff_multiplier
    expression: "staff_multiplier(type, n) = 1.0 + (MAX_MULTIPLIER[type] - 1.0) * [n / (n + STAFF_HALF_POINT[type])]"
    variables: [type, n, MAX_MULTIPLIER, STAFF_HALF_POINT]
    output_range: "[1.0, MAX_MULTIPLIER[type]) — asymptotic, never reaches cap for any finite n"
    source: design/gdd/team-staff-management.md
    referenced_by: []

  - name: hire_cost
    expression: "hire_cost(type, n) = HIRE_BASE_COST[type] * HIRE_COST_GROWTH[type]^n"
    variables: [type, n, HIRE_BASE_COST, HIRE_COST_GROWTH]
    output_range: "[HIRE_BASE_COST[type], unbounded) — deliberately uncapped, the sink itself"
    source: design/gdd/team-staff-management.md
    referenced_by: []

  - name: h_rate_final_with_staff
    expression: "H_rate_final = H_rate(C) * staff_multiplier(troll, n) * (1 - META_HATERS_RESIST_total)"
    variables: ["H_rate(C)", "staff_multiplier(troll, n)", META_HATERS_RESIST_total]
    output_range: "extends meta_haters_resist (above) with Troll's multiplicative factor"
    source: design/gdd/team-staff-management.md
    referenced_by: []

meta_bonus_types:
  - name: META_REACH_MULT
    active_path: pato_streamer
    effect: "permanent multiplier on active-play Reach income"
    cap: 0.50
    source: design/gdd/prestige-checkpoint-system.md
    referenced_by: []

  - name: META_SPONSOR_MULT
    active_path: guru_celebryta
    effect: "permanent multiplier on Sponsor income"
    cap: 0.50
    note: "Lowered from 0.60 (2026-07-13 /design-review) — economy review flagged a permanent never-revocable bonus into a zero-sink resource as riskier than the cap alone can fix; capped at parity with META_REACH_MULT as a Vertical-Slice-scoped mitigation, not a full fix. See prestige-checkpoint-system.md's locked 'Zero-sink Sponsor scope decision' — RESOLVED 2026-07-22 by team-staff-management.md's hire_cost() sink; cap re-examined and left unchanged."
    source: design/gdd/prestige-checkpoint-system.md
    referenced_by: [design/gdd/team-staff-management.md]

  - name: META_HATERS_RESIST
    active_path: ekspert_niszowy
    effect: "permanent reduction on Haters growth rate, online and offline"
    cap: 0.40
    source: design/gdd/prestige-checkpoint-system.md
    referenced_by: [design/gdd/team-staff-management.md]

  - name: META_SPONSOR_FLOOR
    active_path: biznesmen_contentu
    effect: "permanent minimum Sponsor income floor at era start (overrides default reset of 0)"
    cap: 100.0
    source: design/gdd/prestige-checkpoint-system.md
    referenced_by: [design/gdd/team-staff-management.md]

