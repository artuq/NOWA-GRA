# Entity Registry
# Cross-system source of truth for named entities, items, formulas, and constants.
# Values here are locked — GDDs must not silently redefine them.
# Updated by /design-system after each GDD's Phase 5b validation step.

resources:
  - name: Zasięgi
    type: primary_currency
    source: design/gdd/resource-system.md
    referenced_by: [design/gdd/card-content-database.md]

  - name: Cringe
    type: risk_buffer
    range: [0, 100]
    source: design/gdd/resource-system.md
    referenced_by: [design/gdd/card-content-database.md]

  - name: Hatersi
    type: passive_generator
    source: design/gdd/resource-system.md
    referenced_by: []

  - name: Morale
    type: effectiveness_modifier
    range: [0, 100]
    bands:
      high: { range: [70, 100], multiplier: 1.00 }
      normal: { range: [40, 69], multiplier: 0.90 }
      low: { range: [15, 39], multiplier: 0.75 }
      critical: { range: [0, 14], multiplier: 0.50 }
    source: design/gdd/resource-system.md
    referenced_by: [design/gdd/card-content-database.md]

  - name: Sponsorzy
    type: placeholder_currency
    note: "No consumption sink yet — pending Team/Staff Management GDD (Alpha)"
    source: design/gdd/resource-system.md
    referenced_by: [design/gdd/card-content-database.md]

