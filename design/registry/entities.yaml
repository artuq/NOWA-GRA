    safe_range: [0.20, 0.50]
    source: design/gdd/card-ui.md
    referenced_by: []

  - name: flick_velocity_threshold
    value: "800 px/s"
    safe_range: "500-1200 px/s"
    source: design/gdd/card-ui.md
    referenced_by: []

  - name: max_tilt_degrees
    value: 12
    safe_range: [8, 15]
