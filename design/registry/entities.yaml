    source: design/gdd/juice-feedback-system.md
    referenced_by: []

  - name: norm_ref_morale
    value: 30
    safe_range: [20, 40]
    note: "Magnitude normalization for Morale deltas; derived from Resource System band gaps — keep in sync"
    source: design/gdd/juice-feedback-system.md
    referenced_by: []
