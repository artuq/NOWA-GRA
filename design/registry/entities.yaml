    source: design/gdd/card-ui.md
    referenced_by: []

  - name: MIN_REPORT_THRESHOLD_SECONDS
    value: 300
    safe_range: [60, 900]
    note: "Minimum offline Δt before Offline Report Screen appears; revised up from 60s after systems-designer review"
    source: design/gdd/offline-report-screen.md
    referenced_by: []

  - name: card_drag_rotation
    expression: "rotation_degrees = clamp(drag_x / half_screen_width, -1.0, 1.0) × max_tilt_degrees"
    variables: [drag_x, half_screen_width, max_tilt_degrees]
    output_range: "[-max_tilt_degrees, +max_tilt_degrees]"
    source: design/gdd/card-ui.md
    referenced_by: []

  - name: card_commitment_check
    expression: "is_committed = (abs(drag_x_at_release) >= commit_threshold_ratio × screen_width) OR (abs(release_velocity) >= flick_velocity_threshold)"
    variables: [drag_x_at_release, commit_threshold_ratio, screen_width, release_velocity, flick_velocity_threshold]
    output_range: "{true, false}"
    source: design/gdd/card-ui.md
    referenced_by: []

  - name: format_duration
    expression: "format_duration(Δt) = pick largest unit U in {hours, minutes} where Δt >= U.seconds, floor, render 'N unit(s)'"
    variables: ["Δt", U, N]
    output_range: "bounded string, max '24 hours' (no days tier)"
    source: design/gdd/offline-report-screen.md
    referenced_by: []

  - name: margin
