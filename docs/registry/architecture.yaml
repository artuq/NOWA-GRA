# Architecture Registry
# Locked architectural stances established by ADRs. Subsequent ADRs must not contradict
# these without explicitly superseding the originating ADR.

state_ownership:
  - state: "5 currencies (Zasięgi, Cringe, Hatersi, Morale, Sponsorzy)"
    owner: ResourceManager
    interface: "get_resource(name), apply_delta(deltas)"
    source: docs/architecture/adr-0001-autoload-singleton-vs-event-bus.md
    referenced_by: []

  - state: "flag log, pattern counters"
    owner: HistoryFlagManager
    interface: "record_choice(), resolve_path()"
    source: docs/architecture/adr-0001-autoload-singleton-vs-event-bus.md
    referenced_by: []

  - state: "active action state, timer"
    owner: ActionSystem
    interface: "start_action(action_id) -> bool"
    source: docs/architecture/adr-0001-autoload-singleton-vs-event-bus.md
    referenced_by: []

  - state: "save file I/O, debounce timer"
    owner: SaveSystem
    interface: "mark_dirty(), save_now(), load_save()"
    source: docs/architecture/adr-0001-autoload-singleton-vs-event-bus.md
    referenced_by: []

  - state: "offline simulation result"
    owner: OfflineProgressSystem
    interface: "simulate_offline(elapsed_seconds) -> Dictionary"
    source: docs/architecture/adr-0001-autoload-singleton-vs-event-bus.md
    referenced_by: []

  - state: "static card content table (12 cards)"
    owner: CardContentDatabase
    interface: "get_card(id), get_all_cards()"
    source: docs/architecture/adr-0001-autoload-singleton-vs-event-bus.md
    referenced_by: []

  - state: "cooldown counter, presented-card state"
    owner: DecisionCardSystem
    interface: "present_next_card(), resolve_choice(option)"
    source: docs/architecture/adr-0001-autoload-singleton-vs-event-bus.md
    referenced_by: []

  - state: "path affiliation floats [0.0-100.0], tier ints [0-5], active path StringName"
    owner: ClassPathSystem
    interface: "get_affiliation(path_id), get_tier(path_id), get_active_path(), get_active_multiplier(action_id), invest(path_id, resource_id, amount), restore_state(data), reset_era_state()"
    source: docs/architecture/adr-0010-class-path-system-autoload-signal-multiplier.md
    referenced_by: []

  - state: "era_count (int), meta_bonus_totals (Dictionary[StringName, float] per bonus type)"
    owner: PrestigeSystem
    interface: "on_burnout_accepted(), on_burnout_deferred(morale_cost), get_meta_bonus_total(bonus_type), get_era_count(), restore_state(data), serialize_state()"
    source: docs/architecture/adr-0012-prestige-checkpoint-system-autoload-orchestration.md
    referenced_by: [docs/architecture/adr-0013-burnout-challenge-system-trigger-and-selection.md]

  - state: "_cringe_sustained_seconds (float, not persisted), _card_pending (bool, persisted)"
    owner: BurnoutSystem
    interface: "restore_state(data), serialize_state()"
    source: docs/architecture/adr-0013-burnout-challenge-system-trigger-and-selection.md
    referenced_by: []

  - state: "_active_challenge_ids (Array[StringName], era-local)"
    owner: ChallengeSystem
    interface: "get_combined_meta_multiplier(), get_modifier(action_id, axis), restore_state(data), serialize_state()"
    source: docs/architecture/adr-0013-burnout-challenge-system-trigger-and-selection.md
    referenced_by: []

  - state: "coordination_state (CoordinationState enum: NO_OVERLAY/PANEL_OPEN/CARD_PRESENTED) — which of ClassPathPanel/SettingsScreen/BonusesPanel/StaffPanel is open, if any (BonusesPanel added 2026-07-22, StaffPanel added 2026-07-23, both ADR-0014 revisions)"
    owner: MainNavCoordinator (action_screen.gd — not a new Autoload, scene-owned script per ADR-0007 precedent)
    interface: "no public setter — changes exclusively through 6 entry-point wrappers funneling into private _apply_state_change()"
    source: docs/architecture/adr-0014-main-navigation-coordinator.md
    referenced_by: []

interfaces:
  - name: force_cooldown_zero
    signature: "force_cooldown_zero() -> void"
    type: method
    owner: DecisionCardSystem
    note: "Called only by OnboardingGate at Phase1->2 transition; ownership-clear direct write"
    source: docs/architecture/adr-0005-decision-card-weighting-cooldown.md
    referenced_by: []

  - name: get_progress
    signature: "get_progress() -> float"
    type: method
    owner: ActionSystem
    note: "Polled every frame by Action UI; returns 0.0-1.0; guards divide-by-zero when idle"
    source: docs/architecture/adr-0004-action-system-timer-concurrency.md
    referenced_by: [docs/architecture/adr-0007-action-ui-scene-structure-autoload-binding.md]

  - name: action_completed
    signature: "action_completed(action_id: String, payload: Dictionary)"
    type: signal
    emitter: ActionSystem
    subscribers: [OnboardingGate, DecisionCardSystem, ActionGrid, RunningActionOverlay]
    source: docs/architecture/adr-0001-autoload-singleton-vs-event-bus.md
    referenced_by: [docs/architecture/adr-0007-action-ui-scene-structure-autoload-binding.md]

  - name: action_started
    signature: "action_started(action_id: StringName)"
    type: signal
    emitter: ActionSystem
    subscribers: [RunningActionOverlay]
    note: "Emitted on a successful start_action() only; added by ADR-0007's work for RunningActionOverlay"
    source: docs/architecture/adr-0007-action-ui-scene-structure-autoload-binding.md
    referenced_by: []

  - name: card_presented
    signature: "card_presented(card: Dictionary)"
    type: signal
    emitter: DecisionCardSystem
    subscribers: [CardScreen]
    note: "Emitted by present_next_card() when state becomes PRESENTING. Card UI's entry trigger (ADR-0008)"
    source: docs/architecture/adr-0008-card-ui-modal-swipe-integration.md
    referenced_by: []

  - name: card_resolved
    signature: "card_resolved(card_id: StringName, path_tag: StringName, option_chosen: StringName)"
    type: signal
    emitter: DecisionCardSystem
    subscribers: [ClassPathSystem]
    note: "Emitted at end of resolve_choice(), after HistoryFlagManager.increment_counter() — subscribers must assume counter IS already incremented. Added by ADR-0010 (same additive precedent as card_presented). path_tag is '' for neutral cards — ClassPathSystem ignores empty-tag events."
    source: docs/architecture/adr-0010-class-path-system-autoload-signal-multiplier.md
    referenced_by: []

  - name: tier_unlocked
    signature: "tier_unlocked(path_id: StringName, tier: int)"
    type: signal
    emitter: ClassPathSystem
    subscribers: [ClassPathUI, HUD]
    note: "Fired exactly once per tier crossing — never from a getter. Fires during _on_card_resolved() handler, not deferred."
    source: docs/architecture/adr-0010-class-path-system-autoload-signal-multiplier.md
    referenced_by: []

  - name: active_path_changed
    signature: "active_path_changed(path_id: StringName)"
    type: signal
    emitter: ClassPathSystem
    subscribers: [HUD indicator]
    note: "Empty string means no active path (all paths at Tier 0, or a tie). Fired after each card resolution that shifts the active path."
    source: docs/architecture/adr-0010-class-path-system-autoload-signal-multiplier.md
    referenced_by: []

  - name: get_active_multiplier
    signature: "get_active_multiplier(action_id: StringName) -> float"
    type: method
    owner: ClassPathSystem
    note: "Called by ActionSystem at reward resolution. Returns 1.0 if no active path or action not modified by current path tier. O(1) Dictionary lookup. ActionSystem must NOT import ClassPathSystem — uses the global Autoload name only."
    source: docs/architecture/adr-0010-class-path-system-autoload-signal-multiplier.md
    referenced_by: []

  - name: invest
    signature: "invest(path_id: StringName, resource_id: StringName, amount: float) -> bool"
    type: method
    owner: ClassPathSystem
    note: "Gated on card_contribution[path] > 0 (Core Rule 4a) — returns false and applies no state change if the gate fails or the resource can't be afforded. Was a permanent MVP stub (always false); now a live command per ADR-0010 §8."
    source: docs/architecture/adr-0010-class-path-system-autoload-signal-multiplier.md
    referenced_by: []

  - name: get_ambiguous_gap
    signature: "get_ambiguous_gap() -> float"
    type: method
    owner: ClassPathSystem
    note: "Returns best_affiliation - second_affiliation when the active path is ambiguous (tie-break margin triggered, GDD F5 / BUG-003 fix), -1.0 otherwise. UI reads this to show the numeric gap remaining to resolve ambiguity."
    source: docs/architecture/adr-0010-class-path-system-autoload-signal-multiplier.md
    referenced_by: []

  - name: on_burnout_accepted
    signature: "on_burnout_accepted() -> void"
    type: method
    owner: PrestigeSystem
    note: "Single entry point BurnoutSystem's Choice A handler calls. Synchronous call chain only — no await/CONNECT_DEFERRED anywhere in its call graph (binding constraint, ADR-0012 §2). Reads ClassPathSystem state before reset_era_state() clears it."
    source: docs/architecture/adr-0012-prestige-checkpoint-system-autoload-orchestration.md
    referenced_by: []

  - name: inject_priority_card
    signature: "inject_priority_card(card_id: StringName) -> bool"
    type: method
    owner: DecisionCardSystem
    note: "Bypasses normal card pool/weighting/cooldown. General-purpose forced-card injection — BurnoutSystem's Wypalenie card is the first caller, not the only intended one. Blocks normal presentation until resolved; cooldown counter keeps accumulating underneath. Returns false (no-op) if a priority card is already pending, OR card_id doesn't resolve in CardContentDatabase (2026-07-14 code-review fix), OR state != COOLDOWN (2026-07-22, ADR-0016 — self-contained guard, no longer relies on callers replicating BurnoutSystem's external state check) — callers must check the return value, not assume success. Signature corrected 2026-07-17 (ADR-0013 validation) from ADR-0012's original -> void pseudocode."
    source: docs/architecture/adr-0012-prestige-checkpoint-system-autoload-orchestration.md
    referenced_by: [docs/architecture/adr-0013-burnout-challenge-system-trigger-and-selection.md, docs/architecture/adr-0016-decision-card-reentrancy-guard.md]

  - name: get_combined_meta_multiplier
    signature: "get_combined_meta_multiplier() -> float"
    type: method
    owner: ChallengeSystem
    note: "Pull-model read, same shape as ClassPathSystem.get_active_sponsor_multiplier() (ADR-0010 §5a). Called synchronously by PrestigeSystem.on_burnout_accepted() to replace the Story 003-era challenge_mult=1.0 stub. Returns 1.0 (safe default) if no challenges are active."
    source: docs/architecture/adr-0013-burnout-challenge-system-trigger-and-selection.md
    referenced_by: []

  - name: get_modifier
    signature: "get_modifier(action_id: StringName, axis: StringName) -> float"
    type: method
    owner: ChallengeSystem
    note: "Pull-model read consumed by ActionSystem at reward resolution, after the Morale multiplier (Formula C). Returns 1.0 (no-op) if the axis/action isn't targeted by any active challenge. Clamped to CHALLENGE_MODIFIER_FLOOR (0.05) as a hard safety rail."
    source: docs/architecture/adr-0013-burnout-challenge-system-trigger-and-selection.md
    referenced_by: []

  - name: close_requested
    signature: "close_requested()"
    type: signal
    emitter: ClassPathPanel, SettingsScreen, BonusesPanel, StaffPanel (identical pattern on all four; BonusesPanel added 2026-07-22, StaffPanel added 2026-07-23)
    subscribers: [MainNavCoordinator (action_screen.gd)]
    note: "Replaces the previous self-managed visible=false in each panel's Close handler. Peer/notification signal per Architecture Principle 2 — panel does not hold a reference to the coordinator, stays testable in isolation."
    source: docs/architecture/adr-0014-main-navigation-coordinator.md
    referenced_by: []

  - name: compute_next_grant
    signature: "compute_next_grant(path_id: StringName, tier: int) -> Dictionary{granted: bool, type: StringName, amount: float}"
    type: method
    owner: PrestigeSystem
    note: "Pure given explicit path_id/tier params (NOT fetched internally — ClassPathSystem.reset_era_state() clears that state before the real grant runs inside on_burnout_accepted(), so an internal fetch would silently break). amount is the post-F2-cap/4b-i-ceiling applied delta, not the raw grant_magnitude() output. Single implementation shared by pre-commit preview (Wypalenie card) and the real grant — guarantees the two never diverge."
    source: docs/architecture/adr-0017-prestige-grant-preview-api.md
    referenced_by: []

  - name: get_last_grant
    signature: "get_last_grant() -> Dictionary{granted: bool, type: StringName, amount: float}"
    type: method
    owner: PrestigeSystem
    note: "Returns the cached result of the most recent real grant, set inside on_burnout_accepted() via compute_next_grant(). Persisted (serialize_state()/restore_state()) so it survives a restart between era_transitioned firing and Challenge Selection confirming. {granted:false,...} before any burnout ever accepted."
    source: docs/architecture/adr-0017-prestige-grant-preview-api.md
    referenced_by: []

api_decisions:
  - decision: "ResourceFormulas (res://src/core/resource_formulas.gd, class_name ResourceFormulas) is a stateless static-method utility class shared between live-play (ActionSystem) and offline simulation (OfflineProgressSystem) call sites"
    rationale: "Guarantees online/offline formula consistency by construction — one implementation, two call sites, no risk of drift"
    source: docs/architecture/adr-0006-offline-simulation-loop.md
    referenced_by: []

  - decision: "simulate_offline() implemented as a single synchronous while loop, max 1440 iterations (60s steps, 24h cap), no threading/async"
    rationale: "Confirmed sub-millisecond cost even at worst case; matches architecture.md Principle 1 (no threading anywhere)"
    source: docs/architecture/adr-0006-offline-simulation-loop.md
    referenced_by: []

  - decision: "Decision Card cooldown is an integer counter decremented on ActionSystem.action_completed, NOT a Timer — counts completed actions, not elapsed time"
    rationale: "decision-card-system.md specifies cooldown in action-count units; a Timer would require inaccurate time-translation"
    source: docs/architecture/adr-0005-decision-card-weighting-cooldown.md
    referenced_by: []

  - decision: "Each Autoload owning gameplay RNG instantiates its own RandomNumberGenerator member (not global randf()/randi()), with a test-only set_seed() hook for deterministic unit tests"
    rationale: "Global RNG functions share state across all systems, making any one system's randomness non-reproducible in isolation; per-system RNG instances satisfy coding-standards.md's test determinism rule"
    source: docs/architecture/adr-0005-decision-card-weighting-cooldown.md
    referenced_by: []

  - decision: "Single Timer node (child of ActionSystem Autoload) + current_action_id StringName field for single-concurrency enforcement"
    rationale: "Minimal code, uses Godot's built-in Timer correctly; current_action_id != empty guard is the only entry point check needed"
    source: docs/architecture/adr-0004-action-system-timer-concurrency.md
    referenced_by: []

  - decision: "Dedicated Boot scene (boot.tscn) as Project Main Scene, runs BootController._ready() to load save, restore module state, run offline simulation, then change_scene_to_file() to Offline Report or Main scene"
    rationale: "Keeps launch-only sequencing out of the main gameplay scene's _ready(); natural fit for the Offline Report conditional branch"
    source: docs/architecture/adr-0003-scene-management-boot-order.md
    referenced_by: []

  - decision: "Every module owning persisted state must implement restore_state(data: Dictionary) -> void, called by BootController in ADR-0001's dependency order"
    rationale: "Single traceable place for 'what happens at launch'; missing restore_state() calls should be flagged by /architecture-review's traceability check when new modules are added"
    source: docs/architecture/adr-0003-scene-management-boot-order.md
    referenced_by: []

  - decision: "JSON save format, written to user://save.tmp then atomically renamed to user://save.json via DirAccess.rename_absolute()"
    rationale: "Human-readable for solo-dev debugging; atomic rename protects against partial-write corruption on process kill; Android user:// is private internal storage (real POSIX filesystem), not scoped storage, so rename is genuinely atomic"
    source: docs/architecture/adr-0002-save-file-format-atomic-write.md
    referenced_by: []

  - decision: "schema_version field in save data, increment-only, mismatch triggers first-session fallback"
    rationale: "Simple migration path without strict schema validation overhead at this project's save-data complexity"
    source: docs/architecture/adr-0002-save-file-format-atomic-write.md
    referenced_by: []

  - decision: "Autoload singletons for all Core/Foundation modules"
    rationale: "Idiomatic Godot 4.6.3 pattern; matches project scale (7 modules, fully known dependency graph)"
    source: docs/architecture/adr-0001-autoload-singleton-vs-event-bus.md
    referenced_by: []

  - decision: "Direct calls for ownership-clear writes; signals for multi-subscriber events"
    rationale: "Avoids both over-coupling (Alternative B) and unnecessary indirection (Alternative A, central EventBus)"
    source: docs/architecture/adr-0001-autoload-singleton-vs-event-bus.md
    referenced_by: []

  - decision: "Action UI is 3 sibling Control scripts (ResourceHud, ActionGrid, RunningActionOverlay) under one root ActionScreen, each calling ResourceManager/ActionSystem directly — no central UI event bus, no mediating presenter layer"
    rationale: "Each zone has a different update cadence per action-ui.md (event-driven HUD, event-driven Grid, per-frame Overlay); per-zone direct calls keep each script scoped to its own GDD zone without introducing indirection this project's scale (1 screen, 3 zones, 2 Autoload dependencies) doesn't need"
    source: docs/architecture/adr-0007-action-ui-scene-structure-autoload-binding.md
    referenced_by: []

  - decision: "RunningActionOverlay is the sole _process()-using zone in Action UI, gated by set_process(bool) toggled on ActionSystem.action_completed, with an explicit initial-state check in _ready() (Control nodes process by default)"
    rationale: "Keeps per-frame UI work at zero cost while idle; without the explicit _ready() check, the overlay would poll needlessly from scene load until the first completion event ever fires"
    source: docs/architecture/adr-0007-action-ui-scene-structure-autoload-binding.md
    referenced_by: []

  - decision: "Card UI is a full-screen modal Control (CardScreen), the top sibling under ActionScreen, mouse_filter=STOP + dimming backdrop while shown, visible=false when idle -- blocks the Action UI zones beneath only while a card is active (ADR-0008)"
    rationale: "Topmost full-rect STOP Control consumes the touch so sibling zones beneath never receive it; visible=false fully releases input when idle, no per-state mouse_filter management. Modal-over-screen, not a scene swap (keeps Action UI's live state beneath, per card-ui.md)"
    source: docs/architecture/adr-0008-card-ui-modal-swipe-integration.md
    referenced_by: []

  - decision: "CardSwipeMath (res://src/ui/card_swipe_math.gd, class_name CardSwipeMath) is a stateless static utility holding the swipe rotation + commitment-threshold formulas; the gesture state machine + Tween + single-touch index latch live in card_screen.gd (ADR-0008)"
    rationale: "Same precedent as ResourceFormulas/ActionUIFormatting -- pure math is headlessly unit-testable against the GDD's exact numeric ACs, independent of any gesture/scene; only the stateful state machine needs scene_runner + simulated touch"
    source: docs/architecture/adr-0008-card-ui-modal-swipe-integration.md
    referenced_by: []

  - decision: "Offline Report Screen is a standalone full-screen scene (scenes/offline_report/offline_report.tscn), reached via change_scene_to_file() from BootController and dismissed via change_scene_to_file(main) -- NOT a mouse_filter=STOP modal like Card UI (ADR-0009)"
    rationale: "It is a launch-only gate before gameplay exists, not an interruption of live play; a full scene swap matches that lifecycle, whereas Card UI's modal preserves the live Action UI state beneath. Opposite requirements, opposite mechanism"
    source: docs/architecture/adr-0009-offline-report-screen-scene-data-handoff.md
    referenced_by: []

  - decision: "Offline Report Screen reads its data from OfflineProgressSystem.last_simulation_result (the existing launch-only transient field), which BootController augments with an added elapsed_seconds key; no new signal or presenting/idle state machine is added to OfflineProgressSystem (ADR-0009)"
    rationale: "The scene flow (Boot -> Offline Report -> Main) already marks the lifecycle, so a state/signal would have no reader -- unlike Card UI's card_presented, needed because a modal has no scene transition to mark its event. simulate_offline's result lacks elapsed_seconds, which format_duration needs, so BootController adds it to the transient payload"
    source: docs/architecture/adr-0009-offline-report-screen-scene-data-handoff.md
    referenced_by: []

  - decision: "OfflineReportFormatting (res://src/ui/offline_report_formatting.gd, class_name OfflineReportFormatting) is a stateless static utility holding format_duration(elapsed_seconds) -> String; the headline number reuses ActionUIFormatting.format_number, not a second K/M convention (ADR-0009)"
    rationale: "Same per-domain stateless-static-util precedent as ResourceFormulas/ActionUIFormatting/CardSwipeMath -- format_duration is a genuine display derivation, headlessly unit-testable against the GDD's exact duration ACs"
    source: docs/architecture/adr-0009-offline-report-screen-scene-data-handoff.md
    referenced_by: []

  - decision: "Juice/Feedback has NO Autoload and NO new signal: FeedbackMath (res://src/ui/feedback_math.gd, class_name FeedbackMath, stateless static — magnitude(deltas), pulse_scale(m), shake_amplitude_px(m), shake_duration_sec(m), stinger_params(m)) + additive effect code inside ResourceHud (action channel: count-up + self_modulate pill flash) and CardScreen (card channel: scale-pulse + shake + stinger) (ADR-0011)"
    rationale: "System owns zero state (no restore_state by GDD design) so an Autoload contradicts ADR-0001's rationale; a conductor node would violate ADR-0007 zone ownership; deltas are already in hand at both call sites (action_completed payload, presented card's option), so local computation needs no signal changes"
    source: docs/architecture/adr-0011-juice-feedback-stateless-math-ui-effects.md
    referenced_by: []

  - decision: "BurnoutSystem is a thin trigger-detector only (Cringe-sustained timer, warning countdown, forced card injection via inject_priority_card()); ChallengeSystem is a thin selection/modifier-storage system. Neither owns era_count, resource resets, or the META_BONUS grant — that state stays on PrestigeSystem (ADR-0012), which they call into synchronously from a card_resolved signal handler (BurnoutSystem) or get pulled from directly (ChallengeSystem's get_combined_meta_multiplier()) (ADR-0013)"
    rationale: "The 2026-07-01 quick-specs predate PrestigeSystem and assumed BurnoutSystem owned the reset+grant sequence; ADR-0012 shipped with that ownership on PrestigeSystem instead (9 stories, 80 tests, epic closed 2026-07-15) — this decision ratifies the shipped reality rather than reopening a closed epic to match stale quick-specs. Signal-listener pattern (not a direct DecisionCardSystem->BurnoutSystem coupling) matches the existing card_resolved additive-signal precedent (ADR-0008/ADR-0010)"
    source: docs/architecture/adr-0013-burnout-challenge-system-trigger-and-selection.md
    referenced_by: []

  - decision: "MainNavCoordinator is the existing action_screen.gd script extended, not a new Autoload — 10 real entry points (PathButton/SettingsButton/BonusesButton/StaffButton press, ClassPathPanel/SettingsScreen/BonusesPanel/StaffPanel close_requested, back-gesture, DecisionCardSystem/CardScreen read-only pair; BonusesButton/BonusesPanel added 2026-07-22, StaffButton/StaffPanel added 2026-07-23) are thin wrappers funneling into one private synchronous resolver, _apply_state_change(). Extraction to a separate helper class explicitly considered and deferred at 4 panels (YAGNI, no concrete pain yet — revisit at 6+ panels or a real readability finding). Never writes CardScreen.visible (mirror not hub, ADR-0008 precedent). Android back-gesture via NOTIFICATION_WM_GO_BACK_REQUEST + project.godot's quit_on_go_back=false; Web via JavaScriptBridge.eval()/.create_callback() + preventive history.pushState() (ADR-0014)"
    rationale: "coordination_state is scene-scoped, not global game state — an Autoload would need to guard against being meaningless outside action_screen.tscn and would lose @onready's direct sibling references. Extends the already-shipped 'scene-owned script coordinates scene-owned siblings' pattern (ADR-0007) instead of introducing a new architectural shape. Central event bus alternative rejected as an existing forbidden pattern."
    source: docs/architecture/adr-0014-main-navigation-coordinator.md
    referenced_by: []

  - decision: "SettingsSystem is a plain Autoload singleton, same shape as OnboardingGate — one field (reduce_motion: bool, default false), sole write path set_reduce_motion() which marks SaveSystem dirty, reads go directly to the public field with no wrapper method (retrofit — documents already-shipped code, ADR-0015)"
    rationale: "Closes a real traceability gap (SettingsSystem shipped with zero ADR coverage); one-field shape matches current requirement exactly, no speculative multi-setting generality (YAGNI)"
    source: docs/architecture/adr-0015-settings-system-retrofit.md
    referenced_by: []

forbidden_patterns:
  - pattern: "Adding instance vars or @export fields to ResourceFormulas"
    reason: "Must remain stateless — shared by two independent call sites (live play and offline simulation); any state would silently leak across unrelated contexts"
    source: docs/architecture/adr-0006-offline-simulation-loop.md

  - pattern: "Central EventBus autoload (string-keyed event dispatch)"
    reason: "Solves a decoupling problem this project's scale doesn't have; loses static-typing safety of GDScript's typed signals"
    source: docs/architecture/adr-0001-autoload-singleton-vs-event-bus.md

  - pattern: "Subscribing to a signal without a declared dependency in architecture.md's Module Ownership table"
    reason: "Connecting 'just in case' breaks traceability — update the Module Ownership table first if a new dependency is needed"
    source: docs/architecture/adr-0001-autoload-singleton-vs-event-bus.md

  - pattern: "Valence-coded feedback: any effect parameter (color token, pitch/harmony, effect type, curve) varying with the SIGN of a resource delta or win/loss outcome"
    reason: "The GDD's central guarantee (Pillar 2/3): feedback intensity encodes magnitude only, never moral valence — FeedbackMath reads abs(delta) exclusively, and a dedicated sign-invariance unit test enforces it"
    source: docs/architecture/adr-0011-juice-feedback-stateless-math-ui-effects.md
