    status: covered

  - id: TR-cps-005
    system: class-path-system
    gdd: design/quick-specs/class-path-system-2026-07-01.md
    requirement: reset_era_state resets era-local affiliation/tier/counters, preserves meta milestone flags
    adr: [ADR-0010]
