    adr: [ADR-0011]
    status: covered

  - id: TR-juice-003
    system: juice-feedback-system
    gdd: design/gdd/juice-feedback-system.md
    requirement: No-valence-coding — same magnitude yields identical feedback params regardless of delta sign; structurally testable
    adr: [ADR-0011]
    status: covered
    note: FeedbackMath reads abs(delta) only; sign structurally cannot influence output — unit-testable as pure-function property.

