# Technical Requirements Registry
# Stable IDs for GDD technical requirements, persisted across architecture-review runs.
# Never renumber or delete entries — mark status: deprecated if a requirement is removed.
last_updated: 2026-07-01
version: 5

requirements:
  - id: TR-res-001
    system: resource-system
    gdd: design/gdd/resource-system.md
    requirement: Resource mutations must be traceable to their trigger; formulas shared between live play and offline
    adr: [ADR-0001, ADR-0006]
    status: covered

  - id: TR-hist-001
    system: history-flag-system
    gdd: design/gdd/history-flag-system.md
    requirement: Flag log plus pattern counters, owned by a single Autoload
    adr: [ADR-0001]
    status: covered

  - id: TR-save-001
    system: save-persistence-system
    gdd: design/gdd/save-persistence-system.md
    requirement: Autoload-owned save file I/O with mark_dirty/save_now/load_save interface
