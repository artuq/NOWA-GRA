  - id: TR-juice-001
    system: juice-feedback-system
    gdd: design/gdd/juice-feedback-system.md
    requirement: Feedback magnitude formula — linear ratio for bounded resources, log-compressed for unbounded, max-of-contributions, hard clamp [0,1]
    adr: [ADR-0011]
    status: covered
    note: Registered 2026-07-06 (architecture-review). FeedbackMath.magnitude() stateless static; ADR-0011 Proposed at registration.

  - id: TR-juice-002
    system: juice-feedback-system
    gdd: design/gdd/juice-feedback-system.md
