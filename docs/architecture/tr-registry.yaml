    adr: [ADR-0001, ADR-0003, ADR-0005]
    status: covered

  - id: TR-aui-001
    system: action-ui
    gdd: design/gdd/action-ui.md
    requirement: Progress bar updates every frame via cheap poll, not throttled
    adr: [ADR-0004, ADR-0007]
    status: covered
    note: Upgraded partial->covered 2026-06-24 — ADR-0007 scopes get_progress() per-frame polling to RunningActionOverlay via set_process()

  - id: TR-cui-001
    system: card-ui
    gdd: design/gdd/card-ui.md
    requirement: Swipe/drag modal card presentation with commitment threshold
    adr: [ADR-0008]
    status: covered
    note: Covered 2026-06-25 by ADR-0008 (Card UI modal + swipe + card_presented signal). ADR still Proposed — Card UI epic gated until Accepted.

  - id: TR-ors-001
    system: offline-report-screen
    gdd: design/gdd/offline-report-screen.md
    requirement: Offline simulation result presentation screen with dismiss gesture
    adr: [ADR-0009]
    status: covered
    note: ADR-0009 Accepted 2026-06-26 (independent architecture-review, verdict PASS) — standalone scene, reads OfflineProgressSystem.last_simulation_result (+elapsed_seconds added by BootController), dismiss via scene swap to main; boot orchestration already covered by ADR-0003

  - id: TR-cps-001
    system: class-path-system
    gdd: design/quick-specs/class-path-system-2026-07-01.md
    requirement: ClassPathSystem Autoload owns per-path affiliation floats [0-100], tier ints [0-5], and active path resolution
    adr: [ADR-0010]
    status: covered
    note: Registered 2026-07-01 (architecture-review). ADR-0010 Proposed — Class Path stories gated until Accepted.

  - id: TR-cps-002
    system: class-path-system
    gdd: design/quick-specs/class-path-system-2026-07-01.md
    requirement: Card resolution drives path counter increment and affiliation recalc via additive card_resolved signal on DecisionCardSystem
    adr: [ADR-0010]
    status: covered
    note: Additive signal precedent from ADR-0008 (card_presented) / ADR-0007 (action_started). Fires after HistoryFlagManager.increment_counter in resolve_choice().

  - id: TR-cps-003
    system: class-path-system
    gdd: design/quick-specs/class-path-system-2026-07-01.md
    requirement: ActionSystem applies path tier multiplier via pull-model get_active_multiplier(action_id), no ClassPathSystem->ActionSystem dependency
