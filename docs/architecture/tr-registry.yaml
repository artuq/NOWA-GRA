  - id: TR-cps-006
    system: class-path-system
    gdd: design/quick-specs/class-path-system-2026-07-01.md
    requirement: Tier-5 signature card add/remove to DecisionCardSystem pool (signature_card_unlocked/removed signals)
    adr: []
    status: gap
    note: Alpha scope. Signals named in quick-spec Affected Systems but not specified in ADR-0010 interface. Needs a follow-up ADR when Tier 5 / signature cards are implemented.

  - id: TR-cps-007
    system: class-path-system
    gdd: design/quick-specs/class-path-system-2026-07-01.md
    requirement: Path multipliers excluded from offline progress by default (Pillar 4); PATH_MULTIPLIER_OFFLINE flag off by default
    adr: [ADR-0006, ADR-0010]
    status: partial
    note: Behaviour correct — ADR-0006 offline loop owns its formula and never calls get_active_multiplier. ADR-0010 does not state the exclusion explicitly; recommend a one-line clarification before acceptance.
